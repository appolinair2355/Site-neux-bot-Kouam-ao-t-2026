<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baccara Control Room</title>
  <meta name="description" content="Pilotage des stratégies Baccarat, analyse IA et routage Telegram.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080b12; --surface: #101622; --surface-2: #151d2b; --line: #243042;
      --text: #f4f7fb; --muted: #8e9bb0; --soft: #cbd5e1;
      --cyan: #70e1e5; --cyan-2: #1b9fa9; --orange: #f5b86b; --green: #75dfae;
      --red: #ff8390; --violet: #b7a2ff; --shadow: 0 24px 70px rgba(0,0,0,.28);
      --radius: 20px;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body { margin: 0; color: var(--text); background:
      radial-gradient(circle at 12% -10%, rgba(112,225,229,.13), transparent 35rem),
      radial-gradient(circle at 92% 0%, rgba(245,184,107,.10), transparent 28rem), var(--bg);
      font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .mono, code, pre { font-family: "DM Mono", monospace; }
    .shell { max-width: 1220px; margin: auto; padding: 0 24px 72px; }
    header { position: sticky; top: 0; z-index: 10; border-bottom: 1px solid rgba(36,48,66,.75);
      background: rgba(8,11,18,.82); backdrop-filter: blur(18px); }
    .topbar { max-width: 1220px; margin: auto; padding: 17px 24px; display: flex; gap: 28px; align-items: center; }
    .brand { display: flex; gap: 12px; align-items: center; font-weight: 800; letter-spacing: -.04em; }
    .mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px;
      color: #071014; background: linear-gradient(145deg, var(--cyan), var(--orange)); box-shadow: 0 8px 24px rgba(112,225,229,.18); }
    .brand small { display: block; color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
    nav { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
    nav a { color: var(--muted); text-decoration: none; border: 1px solid transparent; padding: 9px 12px; border-radius: 10px; font-size: 13px; font-weight: 700; }
    nav a:hover, nav a.active { color: var(--text); background: var(--surface-2); border-color: var(--line); }
    .status { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; }
    .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
    .status.ok i { background: var(--green); box-shadow: 0 0 0 5px rgba(117,223,174,.1); }
    .eyebrow { color: var(--cyan); font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { max-width: 730px; margin: 16px 0 14px; font-size: clamp(34px, 6vw, 68px); line-height: .98; letter-spacing: -.065em; }
    h2 { font-size: 24px; letter-spacing: -.045em; margin-bottom: 18px; }
    h3 { font-size: 16px; letter-spacing: -.025em; margin-bottom: 8px; }
    p { color: var(--muted); line-height: 1.7; }
    .hero { padding: 68px 0 40px; display: grid; grid-template-columns: 1.5fr .8fr; gap: 38px; align-items: end; }
    .hero p { max-width: 670px; font-size: 15px; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
    .button { display: inline-flex; justify-content: center; align-items: center; gap: 9px; min-height: 44px; padding: 0 16px;
      border: 1px solid var(--line); border-radius: 12px; color: var(--text); background: var(--surface-2); font-weight: 800; font-size: 13px; transition: .18s ease; }
    .button:hover { transform: translateY(-1px); border-color: #49627f; }
    .button.primary { color: #071014; border-color: transparent; background: linear-gradient(135deg, var(--cyan), #b5f2d5); }
    .button.orange { color: #1a1006; border-color: transparent; background: linear-gradient(135deg, var(--orange), #ffd9a4); }
    .button.ghost { background: transparent; }
    .button.danger { color: var(--red); border-color: rgba(255,131,144,.32); background: rgba(255,131,144,.06); }
    .button.small { min-height: 34px; padding: 0 11px; font-size: 11px; border-radius: 9px; }
    .panel { padding: 22px; border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(145deg, rgba(21,29,43,.94), rgba(13,18,28,.94)); box-shadow: var(--shadow); }
    .pulse-card { padding: 20px; border: 1px solid rgba(112,225,229,.25); border-radius: var(--radius); background: linear-gradient(145deg, rgba(19,48,55,.62), rgba(16,22,34,.75)); }
    .live-number { margin: 15px 0 4px; color: var(--cyan); font-size: 42px; font-weight: 800; letter-spacing: -.08em; }
    .live-meta { display: flex; gap: 8px; flex-wrap: wrap; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 999px; color: var(--soft); background: rgba(255,255,255,.05); border: 1px solid var(--line); font-size: 11px; font-weight: 700; }
    .tag.good { color: var(--green); border-color: rgba(117,223,174,.28); background: rgba(117,223,174,.08); }
    .tag.warn { color: var(--orange); border-color: rgba(245,184,107,.28); background: rgba(245,184,107,.08); }
    .tag.bad { color: var(--red); border-color: rgba(255,131,144,.28); background: rgba(255,131,144,.08); }
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 18px 0 42px; }
    .stat { padding: 18px; border: 1px solid var(--line); border-radius: 16px; background: rgba(16,22,34,.76); }
    .stat b { display: block; margin-top: 8px; font-size: 27px; letter-spacing: -.06em; }
    .stat span { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
    .strategy-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(225px, 1fr)); gap: 12px; }
    .strategy-button { min-height: 112px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; padding: 18px;
      border: 1px solid var(--line); border-radius: 17px; color: var(--text); background: var(--surface); transition: .2s; }
    .strategy-button:hover { border-color: var(--cyan); background: #15232c; transform: translateY(-2px); }
    .strategy-button b { font-size: 14px; }
    .strategy-button span { color: var(--muted); font-size: 11px; line-height: 1.4; }
    .strategy-button em { color: var(--cyan); font-size: 11px; font-style: normal; }
    .section { margin-top: 44px; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    .section-head p { margin: 0; font-size: 12px; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .three-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .field { display: grid; gap: 7px; margin-bottom: 14px; }
    .field label { color: var(--soft); font-size: 12px; font-weight: 700; }
    input, select, textarea { width: 100%; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; outline: none; background: #0b111b; }
    input:focus, select:focus, textarea:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(112,225,229,.09); }
    textarea { min-height: 112px; resize: vertical; line-height: 1.55; }
    .check { display: flex; align-items: center; gap: 9px; color: var(--soft); font-size: 12px; }
    .check input { width: auto; accent-color: var(--cyan); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
    .notice { padding: 13px 15px; margin: 14px 0; border-radius: 12px; color: var(--soft); background: rgba(112,225,229,.06); border: 1px solid rgba(112,225,229,.18); font-size: 12px; line-height: 1.55; }
    .notice.warn { border-color: rgba(245,184,107,.28); background: rgba(245,184,107,.06); }
    .notice.error { border-color: rgba(255,131,144,.28); background: rgba(255,131,144,.06); }
    .route-card { padding: 18px; border: 1px solid var(--line); border-radius: 16px; background: rgba(8,11,18,.34); }
    .route-card.public { border-color: rgba(117,223,174,.25); }
    .route-card.shadow { border-color: rgba(183,162,255,.28); }
    .route-title { display: flex; gap: 9px; align-items: center; margin-bottom: 4px; }
    .route-title strong { font-size: 14px; }
    .route-title i { width: 9px; height: 9px; border-radius: 50%; background: var(--green); }
    .shadow .route-title i { background: var(--violet); }
    .route-card p { margin-bottom: 14px; font-size: 11px; }
    .split { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .back { margin-bottom: 16px; }
    .back a { color: var(--muted); font-size: 12px; text-decoration: none; }
    .back a:hover { color: var(--cyan); }
    .proposals { display: grid; gap: 12px; margin-top: 18px; }
    .proposal { padding: 18px; border: 1px solid rgba(183,162,255,.25); border-radius: 15px; background: rgba(183,162,255,.055); }
    .proposal h3 { color: #d8d0ff; }
    .proposal dl { display: grid; grid-template-columns: 130px 1fr; gap: 8px; font-size: 12px; }
    .proposal dt { color: var(--muted); font-weight: 700; }
    .proposal dd { margin: 0; color: var(--soft); line-height: 1.5; }
    .format-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 10px; }
    .format-card { min-height: 142px; padding: 15px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
    .format-card b { color: var(--orange); font-size: 12px; }
    .format-card pre { white-space: pre-wrap; color: var(--soft); font-size: 11px; line-height: 1.55; margin: 12px 0 0; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 11px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; }
    .empty { padding: 36px 20px; color: var(--muted); text-align: center; border: 1px dashed var(--line); border-radius: 14px; }
    .loading { min-height: 160px; display: grid; place-items: center; color: var(--muted); }
    footer { margin-top: 50px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    @media (max-width: 820px) {
      .topbar { gap: 14px; flex-wrap: wrap; } nav { order: 3; width: 100%; margin-left: 0; overflow-x: auto; }
      .hero, .two-col { grid-template-columns: 1fr; } .stat-grid { grid-template-columns: repeat(2,1fr); }
      .three-col { grid-template-columns: 1fr; } .shell { padding: 0 15px 52px; } .hero { padding-top: 40px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <a class="brand" href="#/" style="text-decoration:none">
        <span class="mark">B</span><span>Baccara Control Room<small>Prediction operations</small></span>
      </a>
      <nav>
        <a href="#/" data-nav="home">Accueil</a>
        <a href="#/strategies" data-nav="strategies">Stratégies</a>
        <a href="#/ai" data-nav="ai">Analyseur IA</a>
        <a href="#/ai-strategies" data-nav="ai">Stratégies IA</a>
        <a href="#/diagnostics" data-nav="settings">Envois</a>
        <a href="#/formats" data-nav="formats">Formats</a>
        <a href="#/settings" data-nav="settings">Configuration</a>
      </nav>
      <span id="botStatus" class="status"><i></i> Connexion...</span>
    </div>
  </header>
  <main id="app" class="shell"><div class="loading">Chargement du centre de contrôle...</div></main>
  <script>
    let snapshot = null;
    const $ = (s, root = document) => root.querySelector(s);
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const ids = (value) => String(value || '').split(/[\s,;]+/).map(x => x.trim()).filter(Boolean);
    const formatDate = (value) => value ? new Date(value).toLocaleString('fr-FR', { dateStyle:'short', timeStyle:'short' }) : '—';
    async function api(url, method = 'GET', body) {
      const res = await fetch(url, { method, headers: body ? {'Content-Type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `Erreur ${res.status}`);
      return data;
    }
    function toast(message, type = '') {
      const el = document.createElement('div'); el.className = `notice ${type}`; el.textContent = message;
      document.querySelector('#app')?.prepend(el); setTimeout(() => el.remove(), 5000);
    }
    function setNav(name) {
      document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('active', a.dataset.nav === name));
      const bot = snapshot?.bot;
      const status = $('#botStatus');
      if (status) { status.className = `status ${bot?.running ? 'ok' : ''}`; status.innerHTML = `<i></i>${bot?.running ? 'Bot actif' : bot?.tokenSet ? 'Bot arrêté' : 'Bot non configuré'}`; }
    }
    async function refresh() { snapshot = await api('/api/state'); return snapshot; }
    function liveCard() {
      const live = snapshot.live;
      if (!live) return `<div class="pulse-card"><span class="eyebrow">Flux en attente</span><h3 style="margin-top:14px">Aucun jeu reçu</h3><p class="small">Le bot attend les données du flux Baccarat.</p></div>`;
      return `<div class="pulse-card"><div class="split"><span class="eyebrow">Jeu en direct</span><span class="tag ${live.finished ? 'good' : 'warn'}">${live.finished ? 'Terminé' : 'En cours'}</span></div>
        <div class="live-number mono">#N${esc(live.number)}</div><div class="live-meta"><span class="tag">Joueur ${esc(live.playerValue ?? '—')}</span><span class="tag">Banquier ${esc(live.bankerValue ?? '—')}</span><span class="tag">${esc(live.winner || 'Distribution')}</span></div></div>`;
    }
    function strategyButtons() {
      return (snapshot.strategies || []).map(s => `<button class="strategy-button" onclick="location.hash='#/strategy/${encodeURIComponent(s.key)}'">
        <span class="eyebrow">${s.config?.enabled ? 'Active' : 'En pause'}</span><b>${esc(s.name)}</b><span>${esc((s.about || '').slice(0, 92))}...</span><em>Ouvrir la configuration →</em></button>`).join('');
    }
    function home() {
      setNav('home');
      const ai = snapshot.ai || {};
      const created = (ai.savedStrategies || []).length;
      $('#app').innerHTML = `<section class="section" style="padding-top:38px"><div class="section-head"><div><span class="eyebrow">Accueil</span><h2 style="margin-top:7px">Stratégies existantes</h2></div><span class="tag ${ai.auto?.running ? 'good' : 'warn'}">Analyseur ${ai.auto?.running ? 'en temps réel' : 'arrêté'}</span></div>
        <div class="strategy-grid">${strategyButtons()}</div></section>
        <section class="section"><div class="strategy-grid">
          <button class="strategy-button" onclick="location.hash='#/ai'"><span class="eyebrow">Analyse continue</span><b>Analyseur IA</b><span>Il analyse les jeux lui-même en temps réel et écrit ses constats dans Résultats.</span><em>Ouvrir l’analyseur →</em></button>
          <button class="strategy-button" onclick="location.hash='#/ai-strategies'"><span class="eyebrow">${created} enregistrée(s)</span><b>Stratégies IA créées</b><span>Les stratégies trouvées ou créées par l’analyseur arrivent ici.</span><em>Voir les stratégies IA →</em></button>
        </div></section>`;
    }
    function strategiesPage() { setNav('strategies'); $('#app').innerHTML = `<div class="section-head" style="padding-top:38px"><div><span class="eyebrow">Catalogue</span><h2 style="margin-top:7px">Choisir une stratégie</h2></div><a class="button small ghost" href="#/">Retour accueil</a></div><div class="strategy-grid">${strategyButtons()}</div>`; }
    function routeRows(s) {
      const pub = s.publishedChannels || s.channels || [], shadow = s.shadowChannels || [];
      return `<div class="two-col"><div class="route-card public"><div class="route-title"><i></i><strong>Canal public</strong></div><p>Prédictions directes ou activées après deux pertes. Jamais mélangé avec le canal silencieux.</p>
        <div class="field"><label>ID ou @nom du canal</label><input id="pubChannel" value="${esc(pub.join(', '))}" placeholder="-1001234567890"></div><div class="toolbar"><button class="button small primary" onclick="saveChannel('${s.key}','published')">Vérifier et enregistrer</button><button class="button small danger" onclick="removeChannel('${s.key}','published')">Retirer</button></div></div>
        <div class="route-card shadow"><div class="route-title"><i></i><strong>Canal silencieux</strong></div><p>Signaux calculés pendant le mode silencieux. Il peut être différent du canal public et ne reçoit jamais de publication publique.</p>
        <div class="field"><label>ID ou @nom du canal</label><input id="shadowChannel" value="${esc(shadow.join(', '))}" placeholder="-1009876543210"></div><div class="toolbar"><button class="button small primary" onclick="saveChannel('${s.key}','shadow')">Vérifier et enregistrer</button><button class="button small danger" onclick="removeChannel('${s.key}','shadow')">Retirer</button></div></div></div>`;
    }
    function strategyPage(key) {
      const s = snapshot.strategies.find(x => x.key === key); if (!s) return home();
      setNav('strategies'); const c = s.config || {};
      $('#app').innerHTML = `<div class="back"><a href="#/strategies">← Retour aux stratégies</a></div><div class="section-head"><div><span class="eyebrow">Configuration stratégie</span><h2 style="margin-top:7px">${esc(s.name)}</h2><p class="small">${esc(s.about)}</p></div><span class="tag ${c.enabled ? 'good' : 'bad'}">${c.enabled ? 'Active' : 'En pause'}</span></div>
        <div class="two-col"><div class="panel"><h3>Règles de calcul</h3><div class="three-col"><div class="field"><label>Format</label><input id="cfgFormat" type="number" min="1" max="${snapshot.formatCount}" value="${c.format || 1}"></div><div class="field"><label>Rattrapages</label><input id="cfgMaxR" type="number" min="0" max="9" value="${c.maxR ?? 2}"></div><div class="field"><label>Avance</label><input id="cfgLead" type="number" min="1" max="9" value="${c.lead ?? 2}"></div></div>
          ${s.usesB ? `<div class="field"><label>Compteur B</label><input id="cfgB" type="number" min="0" max="20" value="${c.b ?? 3}"></div>` : ''}
          ${s.key === 'parite' ? `<div class="three-col"><div class="field"><label>Départ</label><input id="cfgStart" type="number" min="1" value="${c.startGame ?? 1}"></div><div class="field"><label>Pas VAR</label><input id="cfgVar" type="number" min="0" value="${c.varStep ?? 0}"></div><div class="field"><label>Décalage</label><input id="cfgDec" type="number" min="1" value="${c.decalage ?? 1}"></div></div>` : ''}
          ${s.key === 'absente' ? `<div class="field"><label>Jeux sans costume</label><input id="cfgStreak" type="number" min="2" max="10" value="${c.streak ?? 3}"></div>` : ''}
          ${s.key === 'ombre' ? `<div class="three-col"><div class="field"><label>Absence minimum</label><input id="cfgAbsence" type="number" min="1" max="30" value="${c.absence ?? 4}"></div><div class="field"><label>Périmètre</label><select id="cfgScope"><option value="tous" ${c.scope !== 'joueur' ? 'selected' : ''}>Joueur + banquier</option><option value="joueur" ${c.scope === 'joueur' ? 'selected' : ''}>Joueur uniquement</option></select></div></div>` : ''}
          <div class="field"><label>Format du message</label><p class="small">Les 87 formats complets sont accessibles depuis le bouton Formats.</p></div><label class="check"><input id="cfgEnabled" type="checkbox" ${c.enabled ? 'checked' : ''}> Activer cette stratégie</label>
          <div class="toolbar" style="margin-top:18px"><button class="button primary" onclick="saveStrategy('${s.key}')">Enregistrer les réglages</button><button class="button ghost" onclick="resetStrategy('${s.key}')">Réinitialiser</button><button class="button small ghost" onclick="testStrategy('${s.key}','published')">Tester canal public</button><button class="button small ghost" onclick="testStrategy('${s.key}','shadow')">Tester canal silencieux</button></div><div id="strategyMessage"></div></div>
        <div class="panel"><h3>Filtre après pertes</h3><p class="small">Le mode silencieux calcule et vérifie chaque signal dans l’ombre. Après une première perte, une fenêtre s’ouvre ; après une deuxième perte dans cette fenêtre, les prochaines prédictions sont activées vers le canal public.</p>
          <label class="check"><input id="cfgSilent" type="checkbox" ${c.silent ? 'checked' : ''}> Activer le mode silencieux</label><div class="field" style="margin-top:18px"><label>Nombre maximum de prédictions après la première perte</label><input id="cfgLossWindow" type="number" min="1" max="20" value="${c.lossWindow ?? 3}"></div><div class="field"><label>Après un gain</label><select id="cfgReset"><option value="1" ${c.resetOnWin !== false ? 'selected' : ''}>Revenir au silence</option><option value="0" ${c.resetOnWin === false ? 'selected' : ''}>Continuer l’envoi</option></select></div><div class="notice">${esc(s.gate?.label || 'État du filtre indisponible')}</div><div class="split small"><span class="muted">Gagnées</span><b style="color:var(--green)">${s.stats?.win ?? 0}</b><span class="muted">Perdues</span><b style="color:var(--red)">${s.stats?.loss ?? 0}</b></div></div></div>
        <section class="section"><div class="section-head"><div><span class="eyebrow">Séparation des sorties</span><h2 style="margin-top:7px">Canaux de cette stratégie</h2></div><span class="tag">${(s.publishedChannels || s.channels || []).length ? 'Public configuré' : 'Public à configurer'} · ${s.shadowChannels?.length ? 'Silencieux configuré' : 'Silencieux à configurer'}</span></div>${routeRows(s)}</section>
        <section class="section"><div class="section-head"><div><span class="eyebrow">Historique court</span><h2 style="margin-top:7px">Prédictions récentes</h2></div></div><div class="panel">${(s.predictions || []).length ? `<table><thead><tr><th>Tour</th><th>Signal</th><th>État</th><th>Routage</th></tr></thead><tbody>${s.predictions.slice(0,20).map(p => `<tr><td class="mono">#N${esc(p.target)}</td><td>${esc(p.label || '')}</td><td><span class="tag ${p.status === 'gagné' ? 'good' : p.status === 'perdu' ? 'bad' : 'warn'}">${esc(p.status)}</span></td><td>${p.silent ? 'Silencieux' : 'Public'}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">Aucune prédiction enregistrée pour cette stratégie.</div>'}</div></section>`;
    }
    function val(id) { return document.getElementById(id)?.value ?? ''; }
    async function saveStrategy(key) {
      const patch = { enabled: $('#cfgEnabled')?.checked, format: val('cfgFormat'), maxR: val('cfgMaxR'), lead: val('cfgLead'), b: val('cfgB'), silent: $('#cfgSilent')?.checked, lossWindow: val('cfgLossWindow'), resetOnWin: val('cfgReset') !== '0', startGame: val('cfgStart'), varStep: val('cfgVar'), decalage: val('cfgDec'), streak: val('cfgStreak'), absence: val('cfgAbsence'), scope: val('cfgScope'), publishedChannels: ids(val('pubChannel')), shadowChannels: ids(val('shadowChannel')) };
      const pub = new Set(patch.publishedChannels), shadow = new Set(patch.shadowChannels), overlap = [...pub].filter(id => shadow.has(id));
      if (overlap.length) return toast('Un même canal ne peut pas être public et silencieux pour la même stratégie.', 'error');
      try { await api(`/api/strategies/${key}`, 'POST', patch); await refresh(); strategyPage(key); toast('Réglages enregistrés.'); } catch (e) { toast(e.message, 'error'); }
    }
    async function saveChannel(key, mode) {
      const input = document.getElementById(mode === 'shadow' ? 'shadowChannel' : 'pubChannel'), values = ids(input?.value);
      if (!values.length) return toast('Renseigne un ID de canal.', 'error');
      const other = ids(document.getElementById(mode === 'shadow' ? 'pubChannel' : 'shadowChannel')?.value);
      if (values.some(v => other.includes(v))) return toast('Les deux canaux doivent être différents.', 'error');
      try { await api(`/api/strategies/${key}/channel`, 'POST', { channelId: values[0], mode }); await refresh(); strategyPage(key); toast(`Canal ${mode === 'shadow' ? 'silencieux' : 'public'} vérifié et enregistré.`); } catch (e) { toast(e.message, 'error'); }
    }
    async function removeChannel(key, mode) { try { await api(`/api/strategies/${key}/channel`, 'DELETE', { mode }); await refresh(); strategyPage(key); } catch (e) { toast(e.message, 'error'); } }
    async function resetStrategy(key) { if (!confirm('Réinitialiser cette stratégie ?')) return; try { await api(`/api/strategies/${key}/reset`, 'POST', {}); await refresh(); strategyPage(key); } catch(e) { toast(e.message, 'error'); } }
    async function testStrategy(key, mode) { try { const r = await api(`/api/strategies/${key}/test`, 'POST', { mode }); toast(`Message de test envoyé : ${(r.sent || []).join(', ')}`, ''); } catch(e) { toast(e.message, 'error'); } }
    function aiPage() {
      setNav('ai'); const aiState = snapshot.ai || {}; const auto = aiState.auto || {};
      $('#app').innerHTML = `<div class="section-head" style="padding-top:38px"><div><span class="eyebrow">Analyse automatique</span><h2 style="margin-top:7px">Analyseur IA en temps réel</h2><p class="small">L’analyseur observe les jeux terminés en continu. Dès qu’il constate quelque chose, il l’écrit dans Résultats. Dès qu’il trouve ou crée une stratégie, elle part dans « Stratégies IA créées ».</p></div><a class="button small ghost" href="#/">Retour accueil</a></div>
      <div class="two-col"><div class="panel"><h3>État du moteur</h3>
        <div class="notice ${auto.running ? '' : 'warn'}">${auto.running ? 'Analyse locale toutes les ' + Math.round((auto.localIntervalMs||15000)/1000) + ' s · enrichissement Pollinations.ai toutes les ' + Math.round((auto.remoteIntervalMs||180000)/60000) + ' min.' : 'Analyseur en pause.'}</div>
        <div class="split small"><span class="muted">Dernière analyse</span><b>${formatDate(auto.lastLocalAt)}</b><span class="muted">Stratégies créées</span><b>${(aiState.savedStrategies||[]).length}</b></div>
        ${auto.lastError ? `<div class="notice error">${esc(auto.lastError)}</div>` : ''}
        <div class="toolbar" style="margin-top:16px"><button class="button primary" onclick="runAuto()">Analyser maintenant</button><button class="button ghost" onclick="toggleAuto(${auto.running ? 'false' : 'true'})">${auto.running ? 'Mettre en pause' : 'Relancer'}</button><a class="button small ghost" href="#/ai-strategies">Stratégies IA créées</a></div><div id="aiMessage"></div></div>
      <div class="panel"><h3>Clé Pollinations.ai</h3><div class="notice ${aiState.configured ? '' : 'warn'}">${aiState.configured ? 'Clé en dur active · modèle ' + esc(aiState.model || 'openai') : 'La clé est écrite en dur dans config.js (POLLINATIONS.API_KEY). Tant qu’elle n’est pas remplacée, seule l’analyse locale tourne — elle suffit pour les constats et les stratégies.'}</div>
        <div class="field"><label>Remplacer la clé sans redéployer</label><input id="aiKey" type="password" autocomplete="off" placeholder="Clé Pollinations.ai"></div><button class="button ghost" onclick="saveAiKey()">Appliquer la clé</button>
        <div class="field" style="margin-top:16px"><label>Analyse ciblée (optionnel)</label><textarea id="aiObjective" placeholder="Ex. Compare les absences de costumes de la main du joueur."></textarea></div><button class="button orange" onclick="runAnalysis()">Analyse Pollinations.ai</button></div></div>
      <div class="section-head" style="margin-top:10px"><div><span class="eyebrow">Résultats</span><h2 style="margin-top:7px">Ce que l’analyseur constate</h2></div></div>
      <div id="aiResult" class="section"></div>`;
      renderAiResults();
    }
    function renderAiResults() {
      const list = (snapshot.ai?.results || []).filter(Boolean);
      const box = $('#aiResult'); if (!box) return;
      if (!list.length) { box.innerHTML = '<div class="empty">Aucun constat pour le moment : l’analyseur attend des jeux terminés.</div>'; return; }
      box.innerHTML = list.map(r => `<div class="panel" style="margin-bottom:14px"><div class="split"><b>${esc(r.title || 'Analyse')}</b><span class="tag">${esc(r.source === 'pollinations' ? 'Pollinations.ai' : 'Moteur local')} · ${r.sample || 0} jeux · ${formatDate(r.generatedAt)}</span></div>
        <p class="small">${esc(r.observation || '')}</p>
        ${(r.findings || []).length ? `<ul class="small">${r.findings.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}
        ${(r.strategies || []).length ? `<div class="proposals">${r.strategies.map((p,i) => `<article class="proposal"><div class="split"><h3>${esc(p.name || ('Proposition ' + (i+1)))}</h3><span class="tag">${esc(p.compatibleExisting || 'à tester')}</span></div><dl><dt>Logique</dt><dd>${esc(p.logic)}</dd><dt>Déclencheur</dt><dd>${esc(p.trigger)}</dd><dt>Preuve</dt><dd>${esc(p.evidence)}</dd><dt>Risque</dt><dd>${esc(p.risks)}</dd></dl></article>`).join('')}</div>` : ''}
        ${(r.nextChecks || []).length ? `<div class="notice">${r.nextChecks.map(esc).join(' · ')}</div>` : ''}</div>`).join('');
    }
    function renderAiResult() { renderAiResults(); }
    function aiStrategiesPage() {
      setNav('ai'); const list = snapshot.ai?.savedStrategies || [];
      $('#app').innerHTML = `<div class="section-head" style="padding-top:38px"><div><span class="eyebrow">Créées par l’analyseur</span><h2 style="margin-top:7px">Stratégies IA</h2><p class="small">Enregistrées automatiquement, jamais activées seules : à tester d’abord en mode silencieux.</p></div><a class="button small ghost" href="#/ai">Retour analyseur</a></div>
      ${list.length ? `<div class="proposals">${list.map(p => `<article class="proposal"><div class="split"><h3>${esc(p.name)}</h3><span class="tag">${esc(p.origin === 'auto-pollinations' ? 'Pollinations.ai' : p.origin === 'auto-local' ? 'Analyse locale' : 'Manuelle')}</span></div><dl><dt>Logique</dt><dd>${esc(p.logic)}</dd>${p.trigger ? `<dt>Déclencheur</dt><dd>${esc(p.trigger)}</dd>` : ''}<dt>Preuve</dt><dd>${esc(p.evidence)}</dd><dt>Risque</dt><dd>${esc(p.risks)}</dd><dt>Créée le</dt><dd>${formatDate(p.createdAt)}</dd></dl><div class="toolbar" style="margin-top:14px">${p.compatibleExisting ? `<a class="button small ghost" href="#/strategy/${encodeURIComponent(p.compatibleExisting)}">Ouvrir la stratégie liée</a>` : ''}<button class="button small danger" onclick="deleteAiStrategy('${p.id}')">Supprimer</button></div></article>`).join('')}</div>` : '<div class="empty">Aucune stratégie créée pour l’instant. L’analyseur en ajoutera dès qu’un signal sera net.</div>'}`;
    }
    async function runAuto() { try { await api('/api/ai/auto/run', 'POST', {}); await refresh(); aiPage(); toast('Analyse effectuée.'); } catch(e) { toast(e.message, 'error'); } }
    async function toggleAuto(on) { try { await api('/api/ai/auto/toggle', 'POST', { enabled: on }); await refresh(); aiPage(); } catch(e) { toast(e.message, 'error'); } }
    async function saveAiKey() { try { await api('/api/ai/key', 'POST', { key: val('aiKey') }); await refresh(); aiPage(); toast('Clé appliquée.'); } catch(e) { toast(e.message, 'error'); } }
    async function deleteAiStrategy(id) { try { await api('/api/ai/strategies/' + id, 'DELETE'); await refresh(); aiStrategiesPage(); } catch(e) { toast(e.message, 'error'); } }
    async function diagnosticsPage() {
      setNav('settings'); $('#app').innerHTML = '<div class="loading">Vérification des canaux…</div>';
      try {
        const r = await api('/api/diagnostics/channels');
        const row = (c) => `<span class="tag ${c.ok ? 'good' : 'bad'}">${esc(c.title || c.id)}${c.ok ? '' : ' — ' + esc(c.error || 'droit de publier manquant')}</span>`;
        $('#app').innerHTML = `<div class="section-head" style="padding-top:38px"><div><span class="eyebrow">Vérification</span><h2 style="margin-top:7px">Envoi des prédictions</h2><p class="small">Contrôle du token, des canaux publics et silencieux de chaque stratégie.</p></div><a class="button small ghost" href="#/settings">Retour configuration</a></div>
        <div class="notice ${r.bot.tokenSet ? '' : 'warn'}">${r.bot.tokenSet ? 'Token Telegram enregistré' + (r.bot.username ? ' (@' + esc(r.bot.username) + ')' : '') : 'Aucun token Telegram : aucune prédiction ne peut partir.'}</div>
        ${r.strategies.map(s => `<div class="panel" style="margin-bottom:12px"><div class="split"><b>${esc(s.name)}</b><span class="tag ${s.ready ? 'good' : 'warn'}">${s.ready ? 'Envoi opérationnel' : 'À configurer'}</span></div>
          <p class="small">Public : ${s.published.length ? s.published.map(row).join(' ') : '<span class="muted">aucun canal</span>'}</p>
          <p class="small">Silencieux : ${s.shadow.length ? s.shadow.map(row).join(' ') : '<span class="muted">aucun canal</span>'}</p>
          <p class="small muted">Messages envoyés : ${s.sentCount} · dernier ${formatDate(s.lastSentAt)}${s.sendError ? ' · ⚠️ ' + esc(s.sendError) : ''}</p>
          <div class="toolbar"><button class="button small ghost" onclick="testStrategy('${s.key}','published')">Tester public</button><button class="button small ghost" onclick="testStrategy('${s.key}','shadow')">Tester silencieux</button></div></div>`).join('')}`;
      } catch(e) { $('#app').innerHTML = `<div class="notice error">${esc(e.message)}</div>`; }
    }
    async function runAnalysis() { const box = $('#aiMessage'); if (box) box.innerHTML = '<div class="notice">Analyse en cours…</div>'; try { await api('/api/ai/analyze', 'POST', { limit: 60, objective: val('aiObjective') }); await refresh(); aiPage(); } catch(e) { if (box) box.innerHTML = `<div class="notice error">${esc(e.message)}</div>`; } }
    async function saveProposal(proposal) { try { await api('/api/ai/strategies', 'POST', { proposal }); await refresh(); toast('Plan de stratégie enregistré, désactivé par sécurité.'); } catch(e) { toast(e.message, 'error'); } }
    async function formatsPage() { setNav('formats'); $('#app').innerHTML = '<div class="loading">Chargement des formats…</div>'; try { const r = await api('/api/formats'); $('#app').innerHTML = `<div class="section-head" style="padding-top:38px"><div><span class="eyebrow">Bibliothèque Telegram</span><h2 style="margin-top:7px">Formats de prédiction</h2><p class="small">${r.count} formats affichés avec leur aperçu réel.</p></div><input id="formatSearch" style="max-width:250px" placeholder="Rechercher un format..." oninput="filterFormats()"></div><div id="formatGrid" class="format-grid">${r.formats.map(f => `<article class="format-card" data-search="${esc(`${f.id} ${f.label} ${f.preview}`.toLowerCase())}"><b>FORMAT ${f.id}</b><pre>${esc(f.preview)}</pre></article>`).join('')}</div>`; } catch(e) { toast(e.message, 'error'); } }
    function filterFormats() { const q = val('formatSearch').toLowerCase(); document.querySelectorAll('.format-card').forEach(c => c.style.display = c.dataset.search.includes(q) ? '' : 'none'); }
    function settingsPage() { setNav('settings'); const bot = snapshot.bot || {}, db = snapshot.db || {}; $('#app').innerHTML = `<div class="section-head" style="padding-top:38px"><div><span class="eyebrow">Système</span><h2 style="margin-top:7px">Configuration générale</h2><p class="small">Les réglages de chaque stratégie restent dans sa propre fiche.</p></div></div><div class="two-col"><div class="panel"><h3>Bot Telegram</h3><div class="notice ${bot.tokenSet ? '' : 'warn'}">${bot.tokenSet ? `Token enregistré : ${esc(bot.tokenMasked || 'masqué')}` : 'Aucun token Telegram configuré.'}</div><div class="field"><label>Token du bot</label><input id="botToken" type="password" autocomplete="off" placeholder="Coller le token Telegram pour le remplacer"></div><div class="field"><label>ID administrateur</label><input id="adminId" type="number" value="${esc(bot.adminId || '')}"></div><button class="button primary" onclick="saveBot()">Enregistrer et redémarrer</button><div id="settingsMessage"></div></div><div class="panel"><h3>Base de données</h3><div class="notice ${db.ready ? '' : 'warn'}">${db.ready ? 'PostgreSQL connectée et prête.' : 'Base non connectée : le bot peut fonctionner avec l’historique en mémoire.'}</div><div class="field"><label>DATABASE_URL (optionnel)</label><input id="dbUrl" type="password" autocomplete="off" placeholder="URL PostgreSQL Render"></div><button class="button ghost" onclick="saveDb()">Connecter la base</button><p class="small" style="margin-top:15px">Sur Render, préfère la variable d’environnement <code>DATABASE_URL</code>.</p></div></div><div class="section"><div class="panel"><h3>Réglages globaux historiques</h3><div class="three-col"><div class="field"><label>Compteur B</label><input id="globalB" type="number" min="1" value="${snapshot.b}"></div><div class="field"><label>Rattrapages</label><input id="globalR" type="number" min="0" max="9" value="${snapshot.maxR}"></div><div class="field"><label>Format par défaut</label><input id="globalF" type="number" min="1" max="${snapshot.formatCount}" value="${snapshot.format}"></div></div><button class="button primary" onclick="saveGlobals()">Enregistrer les réglages globaux</button> <a class="button ghost" href="#/diagnostics">Vérifier les envois</a></div></div>`; }
    async function saveBot() { try { if (val('botToken')) await api('/api/bot/token', 'POST', { token: val('botToken') }); await api('/api/bot/admin', 'POST', { adminId: val('adminId') }); await refresh(); settingsPage(); toast('Configuration Telegram enregistrée.'); } catch(e) { toast(e.message, 'error'); } }
    async function saveDb() { try { await api('/api/db', 'POST', { url: val('dbUrl') }); await refresh(); settingsPage(); toast('Base connectée.'); } catch(e) { toast(e.message, 'error'); } }
    async function saveGlobals() { try { await api('/api/setb', 'POST', { b: val('globalB') }); await api('/api/setmaxr', 'POST', { maxR: val('globalR') }); await api('/api/setformat', 'POST', { format: val('globalF') }); await refresh(); settingsPage(); toast('Réglages globaux enregistrés.'); } catch(e) { toast(e.message, 'error'); } }
    async function route() { try { await refresh(); const h = location.hash || '#/'; if (h.startsWith('#/strategy/')) strategyPage(decodeURIComponent(h.split('/')[2])); else if (h === '#/strategies') strategiesPage(); else if (h === '#/ai') aiPage(); else if (h === '#/ai-strategies') aiStrategiesPage(); else if (h === '#/diagnostics') await diagnosticsPage(); else if (h === '#/formats') await formatsPage(); else if (h === '#/settings') settingsPage(); else home(); } catch(e) { $('#app').innerHTML = `<div class="notice error">${esc(e.message)}</div>`; } }
    window.addEventListener('hashchange', route); route(); setInterval(() => { if (!location.hash || location.hash === '#/') route(); }, 8000);
  </script>
</body>
</html>
